<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aria · AI Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --bg-soft: #12151d;
    --surface: #171b24;
    --surface-2: #1e2330;
    --border: #272d3a;
    --text: #e8eaf0;
    --text-dim: #9aa3b2;
    --accent: #6d8bff;
    --accent-2: #9a6dff;
    --user-bubble: linear-gradient(135deg, #6d8bff, #9a6dff);
    --shadow: 0 8px 30px rgba(0,0,0,0.35);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(154,109,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(109,139,255,0.12), transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
  }

  .app {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(18,21,29,0.7);
    backdrop-filter: blur(12px);
    z-index: 5;
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--user-bubble);
    display: grid; place-items: center;
    font-weight: 700; font-size: 18px; color: white;
    box-shadow: 0 4px 14px rgba(109,139,255,0.4);
    flex-shrink: 0;
  }
  .title h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .title p { font-size: 12.5px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #35d07f; box-shadow: 0 0 8px #35d07f; }
  header .spacer { flex: 1; }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 38px; height: 38px;
    border-radius: 12px;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all .18s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px 22px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 8px; }

  .row { display: flex; gap: 12px; align-items: flex-end; max-width: 100%; animation: rise .35s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .row.user { flex-direction: row-reverse; }
  .bubble-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
    background: var(--user-bubble); margin-bottom: 2px;
  }
  .row.user .bubble-avatar { background: linear-gradient(135deg, #3a4152, #4a5266); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 14.5px;
    max-width: 76%;
    box-shadow: var(--shadow);
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .row.bot .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 8px; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    background: rgba(255,255,255,0.09);
    padding: 2px 6px; border-radius: 6px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px;
  }
  .bubble pre {
    background: #0c0e14; border: 1px solid var(--border);
    padding: 12px 14px; border-radius: 12px; overflow-x: auto; margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble a { color: var(--accent); text-decoration: underline; }
  .row.user .bubble a { color: #e6ecff; }

  /* Typing indicator */
  .typing { display: flex; gap: 5px; padding: 4px 2px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim);
    animation: blink 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0);} 30% { opacity: 1; transform: translateY(-4px);} }

  /* Welcome / empty state */
  .welcome { margin: auto; text-align: center; max-width: 460px; padding: 20px; }
  .welcome .big-avatar {
    width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px;
    background: var(--user-bubble); display: grid; place-items: center;
    font-size: 28px; font-weight: 700; color: #fff; box-shadow: 0 10px 30px rgba(109,139,255,0.4);
  }
  .welcome h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
  .welcome p { color: #ffd60a; font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 14px; cursor: pointer; text-align: left;
    font-size: 13.5px; transition: all .18s ease; line-height: 1.4;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-2px); background: var(--surface-2); }
  .chip strong { display: block; font-weight: 600; margin-bottom: 2px; }
  .chip span { color: var(--text-dim); font-size: 12.5px; }

  /* Composer */
  .composer {
    padding: 14px 18px 20px;
    border-top: 1px solid var(--border);
    background: rgba(11,13,18,0.6);
    backdrop-filter: blur(12px);
  }
  .input-wrap {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 8px 8px 8px 18px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,139,255,0.18); }
  textarea {
    flex: 1; background: none; border: none; color: var(--text);
    font-family: inherit; font-size: 14.5px; line-height: 1.5;
    resize: none; outline: none; max-height: 160px; padding: 8px 0;
  }
  textarea::placeholder { color: var(--text-dim); }
  .send {
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--user-bubble); color: #fff; display: grid; place-items: center;
    flex-shrink: 0; transition: transform .15s ease, opacity .15s ease;
  }
  .send:hover:not(:disabled) { transform: scale(1.07); }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .send svg { width: 19px; height: 19px; }
  .hint { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 10px; }

  @media (max-width: 560px) {
    .suggestions { grid-template-columns: 1fr; }
    .bubble { max-width: 84%; }
    .messages { padding: 20px 14px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">A</div>
    <div class="title">
      <h1>Aria</h1>
      <p><span class="dot"></span> AI assistant · online</p>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="clearBtn" title="Clear conversation" aria-label="Clear conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    </button>
  </header>

  <div class="messages" id="messages" aria-live="polite"></div>

  <div class="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Message Aria…" autofocus></textarea>
      <button class="send" id="send" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
    <div class="hint">Aria can make mistakes. Messages are saved to this session.</div>
  </div>
</div>

<script>
  const $messages = document.getElementById('messages');
  const $input = document.getElementById('input');
  const $send = document.getElementById('send');
  const $clear = document.getElementById('clearBtn');

  // Stable per-browser session id (persists chat history across reloads).
  let sessionId = localStorage.getItem('aria_session');
  if (!sessionId) {
    sessionId = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('aria_session', sessionId);
  }

  const SUGGESTIONS = [
    { t: 'Explain a concept', s: 'How does HTTPS keep my data safe?' },
    { t: 'Brainstorm ideas', s: 'Give me 5 weekend project ideas in JS' },
    { t: 'Write something', s: 'Draft a friendly out-of-office email' },
    { t: 'Plan my day', s: 'Help me plan a focused 4-hour work block' },
  ];

  let busy = false;

  function renderMarkdown(text) {
    const raw = marked.parse(text, { breaks: true, gfm: true });
    return DOMPurify.sanitize(raw);
  }

  function showWelcome() {
    $messages.innerHTML = `
      <div class="welcome">
        <div class="big-avatar">A</div>
        <h2>Hey, I'm Aria 👋</h2>
        <p>Your friendly AI companion, ready whenever you are. Ask me anything — facts, brainstorming, writing, coding, or planning your day.</p>
        <div class="suggestions">
          ${SUGGESTIONS.map((x, i) => `
            <button class="chip" data-i="${i}">
              <strong>${x.t}</strong><span>${x.s}</span>
            </button>`).join('')}
        </div>
      </div>`;
    $messages.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => {
        const i = +c.dataset.i;
        $input.value = SUGGESTIONS[i].s;
        autoGrow(); updateSend(); $input.focus();
        send();
      });
    });
  }

  function addMessage(role, content, { markdown = false } = {}) {
    // Clear welcome if present
    const welcome = $messages.querySelector('.welcome');
    if (welcome) welcome.remove();

    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
    const av = document.createElement('div');
    av.className = 'bubble-avatar';
    av.textContent = role === 'user' ? 'You'.charAt(0) : 'A';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (markdown) bubble.innerHTML = renderMarkdown(content);
    else bubble.textContent = content;
    row.appendChild(av);
    row.appendChild(bubble);
    $messages.appendChild(row);
    scrollDown();
    return bubble;
  }

  function addTyping() {
    const welcome = $messages.querySelector('.welcome');
    if (welcome) welcome.remove();
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';
    row.innerHTML = `<div class="bubble-avatar">A</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    $messages.appendChild(row);
    scrollDown();
  }
  function removeTyping() { document.getElementById('typing-row')?.remove(); }

  function scrollDown() { $messages.scrollTop = $messages.scrollHeight; }

  function autoGrow() {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 160) + 'px';
  }
  function updateSend() { $send.disabled = busy || !$input.value.trim(); }

  async function send() {
    const text = $input.value.trim();
    if (!text || busy) return;
    busy = true; updateSend();

    addMessage('user', text);
    $input.value = ''; autoGrow(); updateSend();
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      removeTyping();
      if (!res.ok) {
        addMessage('bot', '⚠️ ' + (data.error || 'Something went wrong.'));
      } else {
        addMessage('bot', data.reply, { markdown: true });
      }
    } catch (e) {
      removeTyping();
      addMessage('bot', '⚠️ Network error — please try again.');
    } finally {
      busy = false; updateSend(); $input.focus();
    }
  }

  async function loadHistory() {
    try {
      const res = await fetch('/api/history?sessionId=' + encodeURIComponent(sessionId));
      const data = await res.json();
      if (data.messages && data.messages.length) {
        data.messages.forEach(m =>
          addMessage(m.role === 'user' ? 'user' : 'bot', m.content, { markdown: m.role !== 'user' })
        );
      } else {
        showWelcome();
      }
    } catch {
      showWelcome();
    }
  }

  $clear.addEventListener('click', async () => {
    if (!confirm('Clear this conversation?')) return;
    await fetch('/api/clear?sessionId=' + encodeURIComponent(sessionId), { method: 'POST' });
    $messages.innerHTML = '';
    showWelcome();
    $input.focus();
  });

  $input.addEventListener('input', () => { autoGrow(); updateSend(); });
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $send.addEventListener('click', send);

  loadHistory();
</script>
</body>
</html>
